name: Feature request
description: An idea for something new or better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like the game or the launcher to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it make better? How does the original PS2 game behave here, if it matters?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Online
        - Graphics / display
        - Controls
        - Sound
        - Launcher
        - Other
