// Downhill Revived's Android project (finding 091), after SDL 3.4.18's android-project template.
// The Android Gradle Plugin and Gradle are the versions already in GRADLE_USER_HOME:
// AGP 8.7.0 on Gradle 8.10.2 (port/android/build_apk.py writes the wrapper).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
