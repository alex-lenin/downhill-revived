# The toolchain of the Rust GS renderer (port/render).
# x64 Windows, the browser and Android (arm64, finding 091); macOS (Apple silicon) and Linux x64 are
# checked here (rustgs.py check) and built on their own systems. The i686 build is retired.
[toolchain]
channel = "1.97.1"
profile = "minimal"
targets = ["x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "aarch64-linux-android", "aarch64-apple-darwin",
           "x86_64-unknown-linux-gnu"]
