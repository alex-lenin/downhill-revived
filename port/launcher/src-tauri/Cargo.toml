# The player launcher (finding 093): settings, rider name, updates and Discord before dhd.exe starts.
# One Rust core and one HTML/CSS front end (../ui) for Windows, macOS and Linux (Tauri 2).
[package]
name = "dhd_launcher"
version = "1.0.0"
edition = "2021"
rust-version = "1.97"
license = "GPL-3.0-or-later"
description = "Downhill Revived launcher"
publish = false

[[bin]]
name = "DownhillRevived"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# no "compression": the UI is small, and brotli's crates lack the licence files a release needs
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTPS through ureq's rustls (ring) with Mozilla's roots bundled (webpki-roots), on every platform:
# the game's rule too (port/render/net), so no OS certificate store is read and no OpenSSL is needed.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# dhd.ini's keys, defaults, choices and line-keeping saves: the game's own crate (port/render/settings)
dhd_settings = { path = "../../render/settings" }
# the disc image's online check (its game files) and iso-check.txt: the game's own crate (port/render/disc)
dhd_disc = { path = "../../render/disc" }

# SIGTERM and SIGINT end the launcher cleanly (main.rs's quit_signals): the C library's sigaction
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
